<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>qverttus</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #ffffff;
            color: #111111;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .avatar {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            background-color: #111111;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 32px;
            font-weight: bold;
            margin: 0 auto 16px;
            object-fit: cover;
        }
        h1 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }
        p.bio {
            font-size: 14px;
            color: #666666;
            margin-bottom: 32px;
            line-height: 1.5;
        }
        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .link-btn {
            display: block;
            padding: 14px 20px;
            border: 1.5px solid #111111;
            border-radius: 8px;
            text-decoration: none;
            color: #111111;
            font-weight: 500;
            font-size: 15px;
            transition: all 0.2s ease;
        }
        .link-btn:hover {
            background-color: #111111;
            color: #ffffff;
        }
        footer {
            margin-top: 40px;
            font-size: 12px;
            color: #999999;
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="photo.jpg" class="avatar">
        
        <h1>qverttus</h1>
        <p class="bio">:3</p>

        <div class="links">
            <a href="" target="_blank" class="link-btn"></a>
            <a href="" target="_blank" class="link-btn"></a>
            <a href="" target="_blank" class="link-btn"></a>
            <a href="" target="_blank" class="link-btn"></a>
            <a href="" class="link-btn"></a>
        </div>

        <footer>
            © qverttus 2026
        </footer>
    </div>

</body>
</html>
