<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>qverttus</title>
    <style>
        :root {
            --bg: #ffffff;
            --fg: #000000;
        }
        body.dark {
            --bg: #000000;
            --fg: #ffffff;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--fg);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            transition: background-color 0.15s, color 0.15s;
        }
        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 2px solid var(--fg);
            background-color: var(--bg);
            color: var(--fg);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            transition: background-color 0.15s, color 0.15s;
        }
        .theme-toggle:hover {
            background-color: var(--fg);
            color: var(--bg);
        }
        .container {
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .avatar {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            background-color: var(--fg);
            color: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 32px;
            font-weight: bold;
            margin: 0 auto 16px;
            object-fit: cover;
        }
        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }
        p.bio {
            font-size: 15px;
            color: var(--fg);
            margin-bottom: 24px;
            line-height: 1.5;
        }
        .social-icons {
            display: flex;
            justify-content: center;
            gap: 18px;
            margin-bottom: 28px;
        }
        .social-icon {
            color: var(--fg);
            width: 26px;
            height: 26px;
            display: inline-flex;
            transition: transform 0.15s ease;
        }
        .social-icon:hover {
            transform: translateY(-3px);
        }
        .social-icon svg {
            width: 100%;
            height: 100%;
            fill: var(--fg);
        }
        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .link-btn {
            display: block;
            padding: 14px 20px;
            border: 2px solid var(--fg);
            border-radius: 8px;
            text-decoration: none;
            background-color: var(--bg);
            color: var(--fg);
            font-weight: 600;
            font-size: 15px;
            transition: background-color 0.15s, color 0.15s;
        }
        .link-btn:hover {
            background-color: var(--fg);
            color: var(--bg);
        }
        footer {
            margin-top: 40px;
            font-size: 12px;
            color: var(--fg);
        }
    </style>
</head>
<body>

    <button class="theme-toggle" id="themeBtn" title="Инвертировать цвета">◐</button>

    <div class="container">
        <div class="avatar">Q</div>
        
        <h1>qverttus</h1>
        <p class="bio">:3</p>

        <div class="social-icons">

            </a>
        </div>

        <div class="links">
            <a href="https://t.me" target="_blank" class="link-btn">Telegram</a>
            <a href="https://vk.com" target="_blank" class="link-btn">ВКонтакте</a>
            <a href="https://github.com" target="_blank" class="link-btn">GitHub</a>
        </div>

        <footer>
            © 2026 qverttus
        </footer>
    </div>

    <script>
        const btn = document.getElementById('themeBtn');
        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark');
        }
        btn.addEventListener('click', () => {
            document.body.classList.toggle('dark');
            localStorage.setItem('theme', document.body.classList.contains('dark') ? 'dark' : 'light');
        });
    </script>

</body>
</html>
